<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DOOMBOT</title>
<!-- Load Orbitron & Chakra Petch typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Core design tokens & cyber-fortress metallic palette */
  :root {
    color-scheme: dark;
    --bg: #070b0a;
    --surface: #0f1816;
    --ink: #e3ece7;
    --muted: #86998f;
    --line: #2c3d37;
    --accent: #46d686;
    --on-accent: #04110a;
    --bot: #131f1b;
    --steel: #aebbb5;
    --bar: #46d686;
    --metal: linear-gradient(180deg, #eef4f1 0%, #a3b1ab 38%, #56645e 56%, #b9c6c0 100%);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    height: 100dvh;
    margin: 0;
  }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  /* Scanline texture & radial emerald top illumination */
  body {
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .014) 0 1px, transparent 1px 3px),
      radial-gradient(120% 70% at 50% 0%, #12382a 0%, var(--bg) 62%);
    color: var(--ink);
    font: 500 15px/1.6 "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  /* Full-viewport ambient ember canvas */
  #fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* Cursor-following radial glow spotlight */
  #glow {
    position: fixed;
    left: 0;
    top: 0;
    width: 460px;
    height: 460px;
    margin: -230px 0 0 -230px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(61, 220, 132, .13), transparent);
    pointer-events: none;
    z-index: 0;
    transform: translate(50vw, 30vh);
  }

  /* Centered cyber-fortress app shell */
  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 760px;
    height: 100%;
    overflow-x: hidden;
  }

  /* Header & glowing double-line border */
  header {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    padding: 14px 18px 20px;
    background: rgba(5, 9, 8, .72);
    backdrop-filter: blur(6px);
  }

  header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 7px;
    border-top: 2px solid var(--bar);
    border-bottom: 1px solid var(--bar);
    box-shadow: 0 0 8px var(--bar);
  }

  /* Geometric helmet emblem with 3D cursor tilt & status animations */
  .helm {
    width: 46px;
    height: 46px;
    color: var(--accent);
    flex: none;
    filter: drop-shadow(0 0 8px rgba(61, 220, 132, .5));
    transform: perspective(220px) rotateX(var(--tx, 0deg)) rotateY(var(--ty, 0deg));
    transition: transform .12s, filter .3s;
  }

  .busy .helm {
    animation: pulse 1s ease-in-out infinite;
  }

  @keyframes pulse {
    50% {
      filter: drop-shadow(0 0 20px rgba(61, 220, 132, .95));
    }
  }

  .fire .helm {
    animation: flash .55s ease-out;
  }

  @keyframes flash {
    40% {
      filter: drop-shadow(0 0 28px #3dff95) brightness(1.6);
      transform: scale(1.14);
    }
  }

  .title {
    flex: 1 1 150px;
    min-width: 0;
  }

  h1 {
    font: 900 26px/1 Orbitron, "Arial Black", sans-serif;
    margin: 0;
    letter-spacing: 4px;
    display: inline-block;
    transform: skewX(-8deg);
    background: var(--metal);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 #1c3a2b) drop-shadow(0 0 14px rgba(70, 214, 134, .45));
  }

  /* Doom escalation meter */
  .meter {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
  }

  .track {
    flex: 1;
    max-width: 200px;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
  }

  #fill {
    height: 100%;
    width: 4%;
    background: linear-gradient(90deg, #2a9c62, #7fe0a8, #eef4f1);
    transition: width .6s;
  }

  /* Top-right header action buttons */
  .acts {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }

  .hb {
    background: none;
    border: 1px solid var(--line);
    color: var(--steel);
    border-radius: 4px;
    padding: 7px 12px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }

  .hb:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .hb[aria-pressed="true"] {
    background: rgba(232, 194, 106, .12);
    border-color: #e8c26a;
    color: #e8c26a;
  }

  .hb.ic {
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .hb.info {
    width: 34px;
    height: 34px;
    padding: 0;
    border-radius: 50%;
    font: italic 700 16px Georgia, serif;
  }

  /* Temporary chat mode gold overrides */
  .banner {
    padding: 8px 18px;
    font-size: 12px;
    color: #e8c26a;
    background: rgba(232, 194, 106, .08);
    border-bottom: 1px dashed rgba(232, 194, 106, .4);
  }

  .banner[hidden] {
    display: none;
  }

  .temp {
    --bar: #e8c26a;
  }

  .temp header {
    border-bottom: 1px dashed #e8c26a;
  }

  .temp .helm {
    color: #e8c26a;
    filter: drop-shadow(0 0 8px rgba(232, 194, 106, .5));
  }

  /* Personality mode pill bar */
  .modes {
    display: flex;
    gap: 8px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .modes::-webkit-scrollbar {
    display: none;
  }

  .mode {
    background: none;
    border: 1px solid var(--line);
    color: var(--steel);
    border-radius: 999px;
    padding: 6px 15px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
  }

  .mode:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .mode[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }

  /* Scrollable conversation log */
  #log {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: rise .25s ease-out;
  }

  .row.me {
    justify-content: flex-end;
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
  }

  .av {
    width: 30px;
    height: 30px;
    color: var(--accent);
    flex: none;
  }

  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 6px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .me .msg {
    background: linear-gradient(180deg, #5fe69f, #2b9d63);
    color: var(--on-accent);
    font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4), 0 2px 10px rgba(46, 214, 134, .2);
  }

  .row.me.launch .msg {
    animation: launch .55s cubic-bezier(.2, .9, .3, 1.2);
  }

  @keyframes launch {
    0% {
      opacity: 0;
      transform: translateY(70px) scale(.5);
      filter: brightness(2);
    }
    60% {
      opacity: 1;
      transform: translateY(-6px) scale(1.04);
    }
    100% {
      transform: none;
      filter: none;
    }
  }

  .bot .msg {
    background: linear-gradient(145deg, #1b2823, #101a17);
    border: 1px solid #3a4b44;
    border-left: 3px solid var(--accent);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 2px 10px rgba(0, 0, 0, .4);
  }

  /* Animated thinking indicator */
  .dots span {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 4px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 1.2s infinite;
  }

  .dots span:nth-child(2) {
    animation-delay: .2s;
  }

  .dots span:nth-child(3) {
    animation-delay: .4s;
  }

  @keyframes blink {
    0%, 80%, 100% {
      opacity: .2;
    }
    40% {
      opacity: 1;
    }
  }

  /* Response action toolbar */
  .tools {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: -6px 0 0 40px;
    animation: rise .25s ease-out;
  }

  .tools button {
    background: none;
    border: 1px solid var(--line);
    color: var(--steel);
    border-radius: 4px;
    padding: 5px 11px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }

  .tools button:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  /* Empty state welcome screen & starter prompt cards */
  .empty {
    margin: auto;
    text-align: center;
    max-width: 520px;
    padding: 12px 0;
  }

  .empty .helm {
    width: 96px;
    height: 96px;
    margin-bottom: 6px;
  }

  .empty h2 {
    font: 700 20px/1.35 Orbitron, "Arial Black", sans-serif;
    letter-spacing: 1.5px;
    margin: 0 0 8px;
    background: var(--metal);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 #1c3a2b);
  }

  .empty p {
    margin: 0;
    color: var(--muted);
  }

  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
  }

  .cards button {
    text-align: left;
    background: rgba(14, 21, 19, .85);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 13px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }

  .cards button:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 6px 20px rgba(61, 220, 132, .15);
  }

  /* Error alert banner inside chat log */
  .err {
    color: #ff7a5c;
    background: rgba(255, 122, 92, .08);
    border: 1px solid rgba(255, 122, 92, .35);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    text-align: center;
    animation: rise .25s ease-out;
  }

  /* Bottom input bar & send pulse effects */
  .bar {
    position: relative;
    display: flex;
    gap: 8px;
    padding: 12px 16px 16px;
    border-top: 1px solid var(--line);
    background: rgba(5, 9, 8, .8);
  }

  .bar.sweep::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent) -40% 0/40% 100% no-repeat;
    animation: sweep .6s ease-out;
  }

  @keyframes sweep {
    to {
      background-position: 140% 0;
    }
  }

  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 6px;
    padding: 11px 14px;
    font: inherit;
    max-height: 140px;
  }

  textarea:focus {
    border-color: var(--accent);
    outline: none;
    box-shadow: 0 0 0 3px rgba(61, 220, 132, .15);
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #send {
    position: relative;
    background: linear-gradient(180deg, #5fe69f, #2b9d63);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4);
    color: var(--on-accent);
    border: 0;
    border-radius: 6px;
    padding: 0 22px;
    font: 700 13px Orbitron, "Arial Black", sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
  }

  #send:disabled {
    opacity: .45;
    cursor: default;
  }

  #send.fired {
    animation: press .25s;
  }

  @keyframes press {
    50% {
      transform: scale(.9);
    }
  }

  #send.fired::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 6px;
    border: 2px solid var(--accent);
    animation: ring .6s ease-out forwards;
  }

  @keyframes ring {
    to {
      transform: scale(1.7, 2.1);
      opacity: 0;
    }
  }

  /* Creator info modal */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(2, 6, 5, .75);
    backdrop-filter: blur(4px);
  }

  .modal[hidden] {
    display: none;
  }

  .card {
    position: relative;
    width: min(380px, 100%);
    padding: 28px 24px 24px;
    text-align: center;
    background: linear-gradient(145deg, #1b2823, #101a17);
    border: 1px solid #3a4b44;
    border-top: 3px solid var(--accent);
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .07);
    animation: rise .25s ease-out;
  }

  .card .helm {
    width: 64px;
    height: 64px;
  }

  .card h3 {
    margin: 8px 0 14px;
    font: 700 16px Orbitron, "Arial Black", sans-serif;
    letter-spacing: 2px;
  }

  .card dl {
    margin: 0;
    text-align: left;
  }

  .card dt {
    color: var(--muted);
    font-size: 13px;
    margin-top: 10px;
  }

  .card dd {
    margin: 2px 0 0;
    font-size: 16px;
    overflow-wrap: anywhere;
  }

  .card a {
    color: var(--accent);
  }

  .x {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--steel);
    font-size: 20px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
  }

  .x:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* Mobile responsiveness & reduced motion support */
  @media (max-width: 520px) {
    .cards {
      grid-template-columns: 1fr;
    }
    h1 {
      font-size: 23px;
    }
    #send {
      padding: 0 16px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<!-- Reusable geometric hexagonal helmet symbol -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="helm" viewBox="0 0 64 64">
    <path d="M32 4 52 16V40L44 58H20L12 40V16Z" style="fill:var(--surface)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M17 29 28 34 26 38 15 34ZM47 29 36 34 38 38 49 34Z" fill="currentColor"/>
    <path d="M26 48H38" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>
</svg>

<!-- Ambient cursor glow & rising ember canvas -->
<div id="glow"></div>
<canvas id="fx"></canvas>

<!-- Creator attribution modal -->
<div class="modal" id="about" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="ab-t">
    <button class="x" id="ab-x" aria-label="Close">×</button>
    <svg class="helm"><use href="#helm"/></svg>
    <h3 id="ab-t">Created by</h3>
    <dl>
      <dt>Name</dt>
      <dd>Abhay Soni</dd>
      <dt>Email</dt>
      <dd><a href="mailto:abhay.s26007@nst.rishihood.edu.in">abhay.s26007@nst.rishihood.edu.in</a></dd>
    </dl>
  </div>
</div>

<!-- Main DOOMBOT interface -->
<div class="app" id="app">
  <header>
    <svg class="helm"><use href="#helm"/></svg>
    <div class="title">
      <h1>DOOMBOT</h1>
      <div class="meter">
        <span id="lvl">Doom level: calm</span>
        <div class="track"><div id="fill"></div></div>
      </div>
    </div>
    <div class="acts">
      <button id="newchat" class="hb ic" aria-label="New chat" title="New chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </button>
      <button id="temp" class="hb ic" aria-pressed="false" aria-label="Temporary chat" title="Temporary chat (not saved)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 21V11a7 7 0 0 1 14 0v10l-3-2-2 2-2-2-2 2-2-2Z"/>
          <circle cx="9.5" cy="11" r="1" fill="currentColor"/>
          <circle cx="14.5" cy="11" r="1" fill="currentColor"/>
        </svg>
      </button>
      <button id="info" class="hb info" aria-label="About the creator" title="About the creator">i</button>
    </div>
  </header>

  <div class="banner" id="tbanner" hidden>Temporary chat. Nothing here is saved, and it vanishes when you leave this mode.</div>
  <div class="modes" id="modes" role="group" aria-label="Personality"></div>
  <main id="log" aria-live="polite"></main>

  <div class="bar">
    <textarea id="in" rows="1" placeholder="Speak, and be answered" aria-label="Message"></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
  // DOM references
  const log = document.getElementById('log');
  const input = document.getElementById('in');
  const send = document.getElementById('send');
  const app = document.getElementById('app');
  const fill = document.getElementById('fill');
  const lvl = document.getElementById('lvl');
  const tempBtn = document.getElementById('temp');
  const banner = document.getElementById('tbanner');
  const modesEl = document.getElementById('modes');
  const about = document.getElementById('about');
  const infoBtn = document.getElementById('info');

  // Application state
  let history = [];
  let busy = false;
  let temp = false;
  let mode = 'Sovereign';

  // Gemini API configuration (gemini-3-flash-preview)
  const apiKey = "";
  const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

  // Personality system prompts
  const SYS = "You are DOOMBOT, a regal, imperious AI sovereign who rules a fortress while worlds collapse. Speak with grand, formal authority and dramatic flair, and treat every question as a matter of destiny, but always give genuinely accurate, helpful, concise answers, and use plain text without markdown headings. If you are unsure, say so. Never be cruel to the user or give dangerous advice.";

  const PERSONAS = {
    Sovereign: SYS,
    Strategist: "You are DOOMBOT in strategist mode: a cold, brilliant war-room AI. Answer with crisp numbered tactical steps, the main risks, and one recommended move, but stay accurate and helpful. Use plain text without markdown headings.",
    Jester: "You are DOOMBOT in jester mode: a sarcastic, witty court-jester AI. Joke freely, but always give genuinely accurate, helpful, concise answers. Use plain text without markdown headings. Never be cruel."
  };

  function sys() {
    return PERSONAS[mode] || SYS;
  }

  // Starter prompt cards & doom meter progression labels
  const starters = [
    ["Last stand", "Plan a last stand against a world-ending threat"],
    ["Monologue", "Write me a villain’s monologue"],
    ["Destiny", "Explain recursion with the weight of destiny"],
    ["Power", "Which superpower is the most logical?"]
  ];

  const stages = ["calm", "uneasy", "dire", "final hour", "midnight"];
  const helm = '<svg class="av"><use href="#helm"/></svg>';

  // Update Doom Level progress bar & stage label
  function meter() {
    const n = Math.min(history.length / 2, 8);
    fill.style.width = (4 + (n / 8) * 96) + '%';
    lvl.textContent = 'Doom level: ' + stages[Math.min(4, Math.floor(n / 2))];
  }

  // Render initial welcome state & 4 starter cards
  function renderEmpty() {
    log.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = '<svg class="helm"><use href="#helm"/></svg><h2>DOOMBOT online. The multiverse is collapsing.</h2><p>Ask a question, or choose your fate.</p><div class="cards"></div>';
    const c = d.querySelector('.cards');
    starters.forEach(([t, q]) => {
      const b = document.createElement('button');
      b.textContent = q;
      b.title = t;
      b.onclick = () => ask(q);
      c.appendChild(b);
    });
    log.appendChild(d);
  }

  // Append a message bubble to the conversation stream
  function bubble(role, text) {
    const e = log.querySelector('.empty');
    if (e) e.remove();
    const r = document.createElement('div');
    r.className = 'row ' + role;
    if (role === 'bot') r.insertAdjacentHTML('beforeend', helm);
    const m = document.createElement('div');
    m.className = 'msg';
    if (text == null) {
      m.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    } else {
      m.textContent = text;
    }
    r.appendChild(m);
    log.appendChild(r);
    log.scrollTop = log.scrollHeight;
    return m;
  }

  // Trigger visual firing animations on send
  function fire() {
    for (const [el, c] of [[send, 'fired'], [document.querySelector('.bar'), 'sweep'], [app, 'fire']]) {
      el.classList.remove(c);
      void el.offsetWidth;
      el.classList.add(c);
      setTimeout(() => el.classList.remove(c), 700);
    }
  }

  // Exponential backoff fetch wrapper for resilient Gemini API calls
  async function fetchGeminiWithBackoff(payload, maxRetries = 4) {
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          return await response.json();
        }

        // Retry on transient throttling or server overload statuses
        if ((response.status === 429 || response.status === 503 || response.status >= 500) && attempt < maxRetries) {
          const delay = 1000 * Math.pow(2, attempt);
          await new Promise(resolve => setTimeout(resolve, delay));
          continue;
        }

        const errData = await response.json().catch(() => ({}));
        const err = new Error(errData?.error?.message || `HTTP ${response.status}`);
        err.status = response.status;
        throw err;
      } catch (err) {
        if (attempt < maxRetries && (!err.status || err.status === 429 || err.status >= 500)) {
          const delay = 1000 * Math.pow(2, attempt);
          await new Promise(resolve => setTimeout(resolve, delay));
          continue;
        }
        throw err;
      }
    }
  }

  // Stream text smoothly into the DOOMBOT message bubble
  function streamIntoBubble(targetEl, fullText) {
    return new Promise(resolve => {
      if (!fullText) {
        targetEl.textContent = '';
        resolve();
        return;
      }

      // Respect reduced motion preference for immediate rendering
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        targetEl.textContent = fullText;
        log.scrollTop = log.scrollHeight;
        resolve();
        return;
      }

      let index = 0;
      const total = fullText.length;
      // Adaptive chunk sizing so short & long responses feel snappy and fluid
      const step = Math.max(2, Math.ceil(total / 55));

      function tick() {
        index = Math.min(total, index + step);
        targetEl.textContent = fullText.slice(0, index);
        log.scrollTop = log.scrollHeight;
        if (index < total) {
          setTimeout(tick, 16);
        } else {
          resolve();
        }
      }

      tick();
    });
  }

  // Build Gemini API contents array from recent conversation history (last 12 messages)
  function buildContents() {
    let recent = history.slice(-12);
    // Ensure conversation context starts with a 'user' turn as required by Gemini API
    while (recent.length > 0 && recent[0].r !== 'User') {
      recent = recent.slice(1);
    }
    return recent.map(h => ({
      role: h.r === 'User' ? 'user' : 'model',
      parts: [{ text: h.t }]
    }));
  }

  // Send a user prompt and stream DOOMBOT's reply
  async function ask(text) {
    text = text.trim();
    if (!text || busy) return;

    busy = true;
    send.disabled = true;
    app.classList.add('busy');
    input.value = '';
    input.style.height = 'auto';

    // Remove existing toolbars & previous error notices
    log.querySelectorAll('.tools, .err').forEach(el => el.remove());

    const mine = bubble('me', text);
    mine.parentElement.classList.add('launch');
    history.push({ r: 'User', t: text });
    fire();

    const out = bubble('bot', null);

    try {
      const payload = {
        contents: buildContents(),
        systemInstruction: {
          parts: [{ text: sys() }]
        }
      };

      const result = await fetchGeminiWithBackoff(payload);
      const replyText = result?.candidates?.[0]?.content?.parts
        ?.map(p => p.text || '')
        .join('')
        .trim();

      if (!replyText) {
        throw new Error('Empty response received from DOOMBOT core.');
      }

      await streamIntoBubble(out, replyText);
      history.push({ r: 'DOOMBOT', t: replyText });
      meter();
      store();
      tools(out.parentElement, replyText);
    } catch (e) {
      out.parentElement.remove();
      history.pop();
      const er = document.createElement('div');
      er.className = 'err';
      er.textContent = e && e.status === 429
        ? 'The astral relays are overwhelmed. Wait a moment and command DOOMBOT again.'
        : 'DOOMBOT has lost signal with the multiverse core. Check your connection and try again.';
      log.appendChild(er);
      log.scrollTop = log.scrollHeight;
    }

    busy = false;
    send.disabled = false;
    app.classList.remove('busy');
    input.focus();
  }

  // Persistence helpers (disabled in temporary mode)
  function store() {
    if (temp) return;
    try {
      localStorage.setItem('doombot:chat', JSON.stringify(history));
    } catch (e) {
      // Ignore storage quota or private-browsing errors
    }
  }

  function loadSaved() {
    try {
      const v = JSON.parse(localStorage.getItem('doombot:chat') || '[]');
      return Array.isArray(v) ? v.filter(h => h && typeof h.t === 'string') : [];
    } catch (e) {
      return [];
    }
  }

  // Re-render full log from current history array
  function show() {
    log.innerHTML = '';
    if (!history.length) {
      renderEmpty();
    } else {
      history.forEach(h => bubble(h.r === 'User' ? 'me' : 'bot', h.t));
    }
    meter();
    if (history.length && history[history.length - 1].r === 'DOOMBOT') {
      tools(log.lastElementChild, history[history.length - 1].t);
    }
    log.scrollTop = log.scrollHeight;
  }

  // Reliable clipboard copy helper with execCommand fallback for sandboxed iframes
  async function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        // Fallback below
      }
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(ta);
    return ok;
  }

  // Attach Copy, Regenerate, and Go deeper controls under latest DOOMBOT message
  function tools(row, text) {
    log.querySelectorAll('.tools').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'tools';

    const mk = (label, fn) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = () => fn(b);
      t.appendChild(b);
    };

    mk('Copy', async b => {
      const ok = await copyText(text);
      b.textContent = ok ? 'Copied' : 'Copy failed';
      setTimeout(() => { b.textContent = 'Copy'; }, 1500);
    });

    mk('Regenerate', () => {
      if (busy || history.length < 2) return;
      const i = history.length - 2;
      const q = history[i].t;
      history = history.slice(0, i);
      store();
      show();
      ask(q);
    });

    mk('Go deeper', () => {
      ask('Go deeper on that, with one concrete example.');
    });

    row.after(t);
    log.scrollTop = log.scrollHeight;
  }

  // Header controls & input bindings
  send.onclick = () => ask(input.value);

  document.getElementById('newchat').onclick = () => {
    if (busy) return;
    history = [];
    store();
    show();
    input.focus();
  };

  tempBtn.onclick = () => {
    if (busy) return;
    temp = !temp;
    app.classList.toggle('temp', temp);
    tempBtn.setAttribute('aria-pressed', String(temp));
    banner.hidden = !temp;
    history = temp ? [] : loadSaved();
    show();
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      ask(input.value);
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  });

  // Render personality mode selector pills
  ['Sovereign', 'Strategist', 'Jester'].forEach(m => {
    const b = document.createElement('button');
    b.className = 'mode';
    b.textContent = m;
    b.setAttribute('aria-pressed', String(m === mode));
    b.onclick = () => {
      mode = m;
      modesEl.querySelectorAll('.mode').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      input.focus();
    };
    modesEl.appendChild(b);
  });

  // Interactive spotlight & 3D perspective tilt on helmet emblems
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const glow = document.getElementById('glow');
    const root = document.documentElement;
    addEventListener('pointermove', e => {
      glow.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
      root.style.setProperty('--ty', ((e.clientX / innerWidth - 0.5) * 36) + 'deg');
      root.style.setProperty('--tx', (-(e.clientY / innerHeight - 0.5) * 36) + 'deg');
    });
  }

  // Creator attribution modal accessibility & dismissal
  const closeAbout = () => {
    about.hidden = true;
    infoBtn.focus();
  };

  infoBtn.onclick = () => {
    about.hidden = false;
    document.getElementById('ab-x').focus();
  };

  document.getElementById('ab-x').onclick = closeAbout;
  about.addEventListener('click', e => {
    if (e.target === about) closeAbout();
  });

  addEventListener('keydown', e => {
    if (e.key === 'Escape' && !about.hidden) closeAbout();
  });

  // Restore saved session on load
  history = loadSaved();
  show();

  // Ambient drifting emerald embers canvas animation
  (function () {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.getElementById('fx');
    const x = c.getContext('2d');
    let w, h, p = [];

    function size() {
      w = c.width = innerWidth;
      h = c.height = innerHeight;
    }

    size();
    addEventListener('resize', size);

    for (let i = 0; i < 46; i++) {
      p.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 0.6,
        v: Math.random() * 0.5 + 0.15,
        d: Math.random() * Math.PI * 2
      });
    }

    (function loop() {
      x.clearRect(0, 0, w, h);
      for (const e of p) {
        e.y -= e.v;
        e.d += 0.01;
        e.x += Math.sin(e.d) * 0.3;
        if (e.y < -5) {
          e.y = h + 5;
          e.x = Math.random() * w;
        }
        x.beginPath();
        x.arc(e.x, e.y, e.r, 0, 6.283);
        x.fillStyle = `rgba(61, 220, 132, ${0.15 + e.r / 6})`;
        x.fill();
      }
      requestAnimationFrame(loop);
    })();
  })();
</script>
</body>
